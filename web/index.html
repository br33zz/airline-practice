<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Система управления авиакомпанией">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Авиакомпания">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Авиакомпания</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="loading-mark" aria-hidden="true">✈</div>
    <div class="loading-title">Авиакомпания</div>
    <div class="loading-text">Загрузка системы управления</div>
    <div class="loading-spinner" aria-hidden="true"></div>
  </div>
  <style>
    html, body { height: 100%; margin: 0; background: #f5f7fb; }
    #app-loading {
      min-height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      color: #102a56; font-family: Arial, sans-serif;
    }
    .loading-mark { font-size: 54px; color: #155eef; }
    .loading-title { font-size: 28px; font-weight: 700; }
    .loading-text { font-size: 15px; color: #526175; }
    .loading-spinner {
      width: 34px; height: 34px; margin-top: 8px; border-radius: 50%;
      border: 4px solid #c9d7f2; border-top-color: #155eef;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
